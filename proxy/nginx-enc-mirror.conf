# CORS mirror of NOAA ENC cell zips for the s57-parser demo, outside Cloudflare.
# The Cloudflare Worker (noaa-enc-worker.js) is throttled by some Russian ISPs:
# downloads stall after ~16 KB. This mirror runs on a plain VPS; the viewer
# tries it when the Worker stalls. Same contract: GET /enc/<CELL>.zip only.
#
# Installed as /etc/nginx/sites-enabled/enc.studyqa.com on ru-web1 (Beget VPS,
# 31.128.38.189). DNS: A enc.studyqa.com -> 31.128.38.189, Cloudflare DNS-only
# (not proxied). TLS: certbot certonly --webroot -w /var/www/acme -d enc.studyqa.com

proxy_cache_path /var/cache/nginx/noaa-enc levels=1:2 keys_zone=noaaenc:10m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80; listen [::]:80;
    server_name enc.studyqa.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name enc.studyqa.com;
    ssl_certificate     /etc/letsencrypt/live/enc.studyqa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enc.studyqa.com/privkey.pem;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location ~ "^/enc/([A-Z0-9]{8})\.zip$" {
        limit_req zone=perip burst=20 nodelay;
        limit_conn connperip 10;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        limit_except GET HEAD OPTIONS { deny all; }

        set $cell $1;
        proxy_pass https://www.charts.noaa.gov/ENCs/$cell.zip;
        proxy_ssl_server_name on;
        proxy_set_header Host www.charts.noaa.gov;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Cache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_cache noaaenc;
        proxy_cache_key $cell;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;

        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache $upstream_cache_status always;
    }

    location / { return 404; }
}
