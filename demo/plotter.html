<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>S-57 Plotter: offline nautical charts</title>
<meta name="theme-color" content="#0b3d5c">
<link rel="manifest" href="./plotter.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{margin:0;height:100%}
body{font:14px system-ui,sans-serif}
.panel{position:absolute;z-index:1000;background:#fff;border-radius:6px;box-shadow:0 1px 6px #0004;padding:8px}
#menu{left:8px;top:8px;max-width:300px;max-height:calc(100% - 140px);overflow:auto}
#menu summary{cursor:pointer;font-weight:600}
#menu input[type=text]{width:120px}
#menu ul{padding-left:16px;margin:4px 0}
#inst{left:8px;bottom:24px;display:flex;gap:14px;align-items:flex-end}
#inst div{text-align:center}
#inst b{display:block;font-size:22px}
#inst small{color:#666}
#ctl{right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;padding:6px 10px;border:1px solid #888;border-radius:4px;background:#f4f4f4;cursor:pointer}
button.on{background:#0b3d5c;color:#fff;border-color:#0b3d5c}
#status{margin-top:6px;color:#444;font-size:12px}
body[data-mode=NIGHT] .panel,body[data-mode=DUSK] .panel{background:#111;color:#c66}
body[data-mode=NIGHT] .leaflet-tile-pane{filter:brightness(.35)}
</style>
</head><body>
<div id="map"></div>
<div id="menu" class="panel">
  <details open><summary>S-57 Plotter</summary>
    <p style="margin:4px 0"><label>Open charts (.000, .001…, .zip)<br><input id="file" type="file" multiple accept=".zip,.000,.001,.002,.003,.004,.005,.006,.007,.008,.009"></label></p>
    <p style="margin:4px 0">NOAA cell <input id="noaa-cell" type="text" placeholder="US5MA12M"> <button id="noaa-go">Get</button></p>
    <p style="margin:4px 0">Signal K <input id="sk-host" type="text" placeholder="192.168.4.1:3000"> <button id="sk-go">Connect</button></p>
    <p style="margin:4px 0">Display <select id="mode"><option>DAY_BRIGHT</option><option>DUSK</option><option>NIGHT</option></select></p>
    <div>Charts on this device:<ul id="charts"></ul></div>
    <p style="margin:4px 0;font-size:11px;color:#a00">Not for navigation. Prototype.</p>
  </details>
  <div id="status"></div>
</div>
<div id="ctl" class="panel">
  <button id="gps">GPS</button>
  <button id="follow" class="on">Follow</button>
</div>
<div id="inst" class="panel">
  <div><small>SOG</small><b id="sog">–</b></div>
  <div><small>COG</small><b id="cog">–</b></div>
  <div><small>Depth</small><b id="depth">–</b></div>
  <div><small id="src"></small></div>
</div>
<script type="module" src="./dist/plotter.js"></script>
</body></html>
