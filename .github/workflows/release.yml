name: Release to npm

# Publishes every package whose version is not on npm yet.
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed. Each
# package must list this repository + release.yml as a trusted publisher on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions).
#
# To release: bump versions in packages/*/package.json, commit, then push a
# tag like v0.1.3 (or run the workflow manually).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: bun install

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Publish new versions
        run: bun scripts/publish.ts
