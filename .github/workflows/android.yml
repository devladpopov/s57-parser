name: Android plotter APK

# Builds the offline chartplotter (demo/plotter) as an Android app with
# Capacitor. The android/ project is generated on every run, nothing native is
# kept in the repository. Push a tag like plotter-v0.1.0 to attach the APK to a
# GitHub pre-release; manual runs only upload a workflow artifact.

on:
  push:
    tags: ['plotter-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build plotter bundle
        run: |
          bun install --frozen-lockfile
          bun run build
          bun demo/build.ts
          bash apps/android-plotter/build-www.sh

      - name: Generate Android project
        working-directory: apps/android-plotter
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          # GPS for own-ship position; GPS hardware is optional (Wi-Fi tablets).
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          # Light app theme with dark status bar icons (white on white otherwise).
          styles=android/app/src/main/res/values/styles.xml
          sed -i 's#Theme.AppCompat.DayNight.NoActionBar#Theme.AppCompat.Light.NoActionBar#; s#<item name="windowNoTitle">true</item>#&\n        <item name="android:windowLightStatusBar">true</item>#' "$styles"
          cat "$styles"
          grep -q windowLightStatusBar "$styles"
          # Every build gets a higher version code so it installs over the previous one.
          sed -i -E "s#versionCode [0-9]+#versionCode $GITHUB_RUN_NUMBER#" android/app/build.gradle
          grep -q "versionCode $GITHUB_RUN_NUMBER" android/app/build.gradle

      - name: Build APK
        working-directory: apps/android-plotter/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Signed with the release key from the repository secrets, so a new build
      # installs over the old one and RuStore accepts it as an update.
      - name: Sign APK
        working-directory: apps/android-plotter/android
        env:
          KEYSTORE_B64: ${{ secrets.PLOTTER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLOTTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLOTTER_KEY_ALIAS }}
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$bt/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$GITHUB_WORKSPACE/s57-plotter.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          "$bt/apksigner" verify --print-certs "$GITHUB_WORKSPACE/s57-plotter.apk" | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: s57-plotter-apk
          path: s57-plotter.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/plotter-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" s57-plotter.apk --prerelease \
            --title "S-57 Plotter for Android ${GITHUB_REF_NAME#plotter-v}" \
            --notes "Offline S-57 chartplotter prototype for Android (release-signed APK, install manually). Not for navigation."
